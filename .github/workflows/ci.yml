name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_TieredPGO_InstrumentOnlyHotCode: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # Every sample built, the Puppeteer one too (not run: it downloads a browser); each document rendered and checked
    - run: dotnet build WeblitzPdf.Samples.slnx -c Release
    - run: dotnet test tests/WeblitzPdf.Samples.Tests -c Release --no-build
